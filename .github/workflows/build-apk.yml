name: Android CI (Compile and Export APK)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the Java Development Kit (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Setup Gradle (and configure automatic caching of dependencies and cache files)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Grant execute permission for the gradlew wrapper
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 5. Automatically generate a debug.keystore if it's missing (as it's in .gitignore)
    - name: Generate Debug Keystore
      run: |
        if [ ! -f debug.keystore ]; then
          echo "Generating temporary debug keystore for build integration..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        else
          echo "Using existing debug keystore."
        fi

    # 6. Run Local JVM Unit Tests (Robolectric etc.)
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    # 7. Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # 8. Upload the compiled APK as a downloadable GitHub Actions artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14 # Store the artifact for 14 days before automatic cleanup
